name: APK жинау
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Қолтаңба кілті (keystore)
        env:
          KS_B64: ${{ secrets.UNEM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/unem.jks"
            echo "UNEM_KS_PATH=$RUNNER_TEMP/unem.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::UNEM_KEYSTORE_B64 жоқ — APK уақытша debug кілтімен қол қойылады"
          fi
      - run: gradle assembleDebug --no-daemon
        env:
          UNEM_KS_PASS: ${{ secrets.UNEM_KS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: Unem-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Жүктеу сілтемесі (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Unem.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Unem.apk --title "Үнем APK" --notes "Соңғы нұсқа" --target ${{ github.sha }}
      - name: Telegram-ға жіберу
        if: ${{ success() }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Telegram secrets жоқ, өткізілді"; exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
            -F chat_id="$TG_CHAT" -F document=@Unem.apk \
            --form-string caption="Үнем жаңа нұсқасы дайын (жиналым №${{ github.run_number }}). Үстінен орната бер, деректер сақталады." > /dev/null || echo "Telegram-ға жіберілмеді"
      - name: Telegram-ға қате туралы хабарлау
        if: ${{ failure() }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" --data-urlencode text="Үнем жиналымы сәтсіз болды (№${{ github.run_number }}): https://github.com/${{ github.repository }}/actions" > /dev/null || true
