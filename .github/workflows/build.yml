name: APK жинау
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Қолтаңба кілті (keystore)
        env:
          KS_B64: ${{ secrets.UNEM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/unem.jks"
            echo "UNEM_KS_PATH=$RUNNER_TEMP/unem.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::UNEM_KEYSTORE_B64 жоқ — APK уақытша debug кілтімен қол қойылады"
          fi
      - run: gradle assembleDebug --no-daemon
        env:
          UNEM_KS_PASS: ${{ secrets.UNEM_KS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: Unem-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Жүктеу сілтемесі (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Unem.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Unem.apk --title "Үнем APK" --notes "Соңғы нұсқа" --target ${{ github.sha }}
